# config.yaml — maj_github.py v1.3
# Mise a jour du site GitHub Hebreu4.0
# Placer ce fichier dans le meme dossier que maj_github_v1.3.py

# Dossier contenant les fichiers source editables par l'utilisateur
racine_source     = C:\test\modif\Hebreu4.0

# Dossier racine du site local (depot git clone de GitHub)
racine_site_local = C:\SiteGITHUB\Hebreu4.0

# Chemin complet vers lancer.cmd (generateur du site)
lancer_cmd        = C:\SiteGITHUB\Hebreu4.0\prog\lancer.cmd

# URL du depot GitHub (informatif uniquement)
url_github        = https://github.com/GuyTitt/Hebreu4.0

# ── Authentification GitHub ────────────────────────────────────
# Token PAT : GitHub > Settings > Developer settings >
#             Personal access tokens > Tokens (classic) > cocher "repo"
github_token      = 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

# Votre nom d'utilisateur GitHub
github_user       = GuyTitt

# ── Options ───────────────────────────────────────────────────
# Message du commit : "auto" = date+heure automatique
message_commit    = auto

# Branche git cible
branche           = main

# Demander confirmation avant le push GitHub
# true  = afficher une boite de dialogue (defaut)
# false = pousser automatiquement sans demander
confirmation_git  = true

# Delai d'attente (secondes) apres lancer.cmd pour que le site
# soit genere avant d'arreter le serveur node
# Augmenter si le site est volumineux (> 15s de generation)
delai_generation  = 15

# Filtre : laisser vide pour synchroniser tous les fichiers modifies
# Exemples :
#   .*\.docx$          => uniquement les fichiers Word
#   .*\.docx$,.*\.html$ => Word et HTML
filtre            = .*\.docx$,.*\.html$
